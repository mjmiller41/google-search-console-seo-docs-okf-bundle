name: Sync Google Search Central docs

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite every concept even when unchanged"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PANDOC_VERSION: "3.7.0.2"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned rather than taken from apt: pandoc's table handling changes
      # between releases, so an unpinned version would rewrite concepts
      # whenever the runner image moves.
      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/mjmiller41/cli-agent-okf.git

      - name: Sync bundle
        run: python sync_docs.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync bundle with upstream Google Search Central docs"
          git push
